<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate - Sufiya Hameedia Trust</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', sans-serif;
            padding: 1rem;
        }
        .qr-container {
            background: #fff;
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 1.3rem;
            color: #1b1d12;
            margin-bottom: 0.5rem;
        }
        p {
            color: #555;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .qr-img {
            width: 100%;
            max-width: 300px;
            border-radius: 10px;
        }
        .upi-id {
            margin-top: 1rem;
            background: #f0f0f0;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .copy-btn {
            background: #667eea;
            color: #fff;
            border: none;
            padding: 0.4rem 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .copy-btn:active { transform: scale(0.95); }
        .back-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: #667eea;
            text-decoration: none;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="qr-container">
        <h1>Sufiya Hameedia Trust</h1>
        <p>Scan to donate via any UPI app</p>
        <img src="../images/donation-qr.png" alt="Donation QR Code" class="qr-img">
        <div class="upi-id">
            <span id="upiText">sufiyahameediatrust@indianbk</span>
            <button class="copy-btn" onclick="copyUPI()">📋 Copy</button>
        </div>
        <a href="/" class="back-link">&larr; Back to website</a>
    </div>
    <script>
        function copyUPI() {
            const text = document.getElementById('upiText').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = '✅ Copied!';
                setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
            });
        }
    </script>
</body>
</html>
